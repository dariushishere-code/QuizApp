<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Quiz App</h1>
      <p class="subtitle">Open Trivia Database</p>
    </header>

    <!-- Start Screen -->
    <section id="start-screen" class="screen active">
      <div class="card">
        <h2>Start a Quiz</h2>

        <div class="form-group">
          <label for="amount">Number of Questions</label>
          <select id="amount">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>

        <div class="form-group">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="">Any</option>
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category (optional)</label>
          <select id="category">
            <option value="">Any Category</option>
          </select>
        </div>

        <button id="start-btn" class="btn btn-primary">Start Quiz</button>
      </div>
    </section>

    <!-- Loading Screen -->
    <section id="loading-screen" class="screen">
      <div class="card loading-card">
        <div class="spinner"></div>
        <p>Loading questions...</p>
      </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="screen">
      <div class="card">
        <div class="quiz-header">
          <div class="progress-info">
            <span id="question-counter">Question 1 of 10</span>
            <span id="score-display">Score: 0</span>
          </div>
          <div id="timer" class="timer hidden">15s</div>
        </div>

        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <h2 id="question-text" class="question-text"></h2>

        <div id="options-container" class="options"></div>

        <div class="quiz-actions">
          <button id="next-btn" class="btn btn-primary" disabled>Next Question</button>
        </div>
      </div>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="screen">
      <div class="card">
        <h2>Quiz Results</h2>
        <div class="score-summary">
          <div class="score-circle">
            <span id="final-score">0</span>
            <span class="score-label">/ <span id="total-questions">10</span></span>
          </div>
          <p id="score-message"></p>
        </div>

        <div class="results-list">
          <h3>Questions & Correct Answers</h3>
          <ul id="results-ul"></ul>
        </div>

        <button id="restart-btn" class="btn btn-primary">Start Again</button>
      </div>
    </section>

    <!-- Error / Empty -->
    <section id="error-screen" class="screen">
      <div class="card">
        <h2>No Questions Found</h2>
        <p id="error-message">سؤالی یافت نشد / No questions found for the selected settings.</p>
        <button id="back-btn" class="btn btn-secondary">Back to Start</button>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
